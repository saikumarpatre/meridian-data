name: Update Meridian data
on:
  schedule:
    - cron: "*/30 3-10 * * 1-5"   # every 30 min during NSE hours (09:00-16:00 IST, Mon-Fri)
    - cron: "17 13 * * *"          # once each evening for closing prices
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: meridian-data
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch market data
        env:
          UPSTOX_TOKEN: ${{ secrets.UPSTOX_TOKEN }}
        run: |
          mkdir -p data/charts
          node scripts/update.mjs
      - name: Daily research (evening run and manual runs)
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '17 13 * * *'
        env:
          UPSTOX_TOKEN: ${{ secrets.UPSTOX_TOKEN }}
        run: node scripts/research.mjs
      - name: Save changes
        run: |
          git config user.name "meridian-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Update market data"
          git push
